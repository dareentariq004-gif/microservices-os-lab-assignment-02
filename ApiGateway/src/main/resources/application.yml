server:
  port: 8080

spring:
  application:
    name: APIGATEWAY

  cloud:
    gateway:
      routes:
        - id: menu
          uri: "lb://MENU"
          predicates:
            - Path=/menu/**

        - id: customer
          uri: "lb://CUSTOMER"
          predicates:
            - Path=/customers/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka